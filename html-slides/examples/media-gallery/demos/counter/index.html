<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column;
           align-items: center; justify-content: center; height: 100vh; margin: 0;
           background: #fafafa; color: #222; }
    h1 { color: rgb(106,0,95); }
    #count { font-size: 4rem; font-weight: 700; margin: 12px 0; }
    button { font-size: 1.2rem; padding: 10px 24px; border: none; border-radius: 8px;
             background: rgb(106,0,95); color: #fff; cursor: pointer; }
    button:hover { background: rgb(140,0,125); }
  </style>
</head>
<body>
  <h1>Hello Demo</h1>
  <div id="count">0</div>
  <button id="inc">+1</button>

  <script>
    // 最小交互 Demo：点击按钮，数字 +1
    let n = 0;
    const display = document.getElementById('count');
    document.getElementById('inc').addEventListener('click', () => {
      n += 1;
      display.textContent = n;
      // 可选的 Slide<->Demo 通信：通知父页面
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'demo-event', name: 'hello', value: n }, '*');
      }
    });
  </script>
</body>
</html>
